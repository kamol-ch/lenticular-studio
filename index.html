<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lenticular Card Studio</title>
  <meta name="description" content="Make lenticular cards (3D depth, animation, or both) from watercolor scans. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23264653'/%3E%3Cpath d='M6 26V6M11 26V6M16 26V6M21 26V6M26 26V6' stroke='%23e9c46a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--brand)"/><path d="M6 26V6M11 26V6M16 26V6M21 26V6M26 26V6" stroke="var(--accent)" stroke-width="3"/></svg>
      <span>Lenticular Card Studio</span>
    </div>
    <input id="project-name" class="project-name" aria-label="Project name" spellcheck="false">
    <div id="header-progress" class="header-progress"></div>
    <div class="top-actions"><span id="btn-ask"></span><span id="btn-undo"></span><span id="btn-redo"></span><span id="btn-new"></span><span id="btn-open"></span><span id="btn-save"></span></div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Steps">
      <ol id="steps"></ol>
      <div id="frames-status" class="frames-status"></div>
      <p class="privacy">Everything runs locally. Nothing is uploaded.</p>
      <p id="autosave-status" class="privacy" aria-live="polite"></p>
    </nav>
    <main id="main" tabindex="-1"></main>
    <section id="editor" class="editor" hidden>
      <div class="editor-center">
        <div class="stage-bar">
          <div id="stage-tools" class="stage-tools"></div>
          <div id="stage-view" class="stage-view"></div>
        </div>
        <div id="stage" class="stage-host"></div>
        <div id="stage-strip" class="stage-strip" hidden></div>
      </div>
      <aside id="inspector" class="inspector" aria-label="Step settings"></aside>
    </section>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>This app needs JavaScript.</noscript>
</body>
</html>
